name: Ping Server

on:
  schedule:
    # Runs every 10 minutes (Render free tier sleeps after 15 min idle)
    - cron: '*/10 * * * *'
  workflow_dispatch: 

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: curl -fsS --max-time 90 https://internly-dev.onrender.com/api/health
